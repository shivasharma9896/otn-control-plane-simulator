name: ci

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and test
        run: make clean all test
      - name: Sanitizer test build
        run: |
          make clean
          make CFLAGS="-Wall -Wextra -Werror -std=c11 -pthread -Iinclude -fsanitize=address,undefined -fno-omit-frame-pointer" LDFLAGS="-pthread -fsanitize=address,undefined" all test
      - name: Static checks
        run: |
          sudo apt-get update
          sudo apt-get install -y cppcheck
          cppcheck --enable=warning,performance --error-exitcode=1 --std=c11 --inline include src
